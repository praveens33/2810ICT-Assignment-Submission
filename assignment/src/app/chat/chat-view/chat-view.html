<div class="chat-container">
  
  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="group-tabs-container">
      <div *ngFor="let group of myGroups; trackBy: trackByGroup" @listAnimation
          (click)="selectGroup(group)"
          [class.active-group]="group._id === selectedGroup?._id"
          class="group-tab">
        <span>{{ group.name }}</span>
        <button *ngIf="group._id === selectedGroup?._id" (click)="leaveGroup(group._id); $event.stopPropagation()" class="btn-leave">x</button>
      </div>
    </div>
    <div class="top-bar-actions">
      <!-- Video Call Button -->
      <a (click)="goToVideoCall()" class="btn btn-sm btn-outline-success settings-button" style="cursor: pointer;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-camera-video-fill" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M0 5a2 2 0 0 1 2-2h7.5a2 2 0 0 1 1.983 1.738l3.11-1.382A1 1 0 0 1 16 4.269v7.462a1 1 0 0 1-1.406.913l-3.111-1.382A2 2 0 0 1 9.5 13H2a2 2 0 0 1-2-2V5z"/>
        </svg>
        <span class="d-none d-md-inline ms-1">Join Global Call</span>
      </a>
      <a (click)="goToUserSettings()" class="btn btn-sm btn-outline-secondary settings-button" style="cursor: pointer;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear-fill" viewBox="0 0 16 16"><path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311a1.464 1.464 0 0 1-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705-1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c-1.4-.413-1.4-2.397 0-2.81l.34-.1a1.464 1.464 0 0 1 .872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/></svg>
        <span class="d-none d-md-inline ms-1">Settings</span>
      </a>
    </div>
    

    
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <img [src]="(authService.currentUser?.profilePicture || '/uploads/default-avatar.png')" alt="My Avatar" class="sidebar-avatar">
        <div class="sidebar-user-info">
          <strong>{{ authService.currentUser?.username }}</strong>
        </div>
      </div>

      <div class="channel-list">
        <h4>Channels in {{ selectedGroup?.name }}</h4>
        <ul>
          <li *ngFor="let channel of channels; trackBy: trackByChannel" @listAnimation
              (click)="selectChannel(channel)"
              [class.active-channel]="channel._id === selectedChannel?._id">
            #{{ channel.name }}
          </li>
        </ul>
      </div>

      <div class="discover-groups">
        <h4>Discover Groups</h4>
        <ul>
          <li *ngFor="let group of allGroups; trackBy: trackByGroup" @listAnimation class="discover-item">
            <span>{{ group.name }}</span>
            <button (click)="requestToJoinGroup(group._id)" class="btn btn-sm btn-success">Join</button>
          </li>
        </ul>
      </div>
      
      <div class="user-list">
        </div>
    </div>

   <!-- CHAT AREA -->
   <!-- The Video Call Component is self-contained and gets the active channel ID -->
   <div class="chat-area">
    <div class="message-window">
      <div *ngFor="let message of messages" 
           class="message"
           [class.my-message]="message.username === authService.currentUser?.username"
           [class.system-notification]="message.username === 'System'"
           [class.message-with-image]="message.imageUrl">
        <img [src]="(message.author?.profilePicture || 'assets/default-avatar.png')" 
             alt="avatar" 
             class="message-avatar"
             *ngIf="message.username !== 'System'">
        <div class="message-content">
          <div class="message-header" *ngIf="message.username !== 'System'">
            <strong>{{ message.username }}</strong>
            <span class="message-timestamp">{{ message.createdAt | date:'shortTime' }}</span>
          </div>
          <p *ngIf="message.text">{{ message.text }}</p>
          <img *ngIf="message.imageUrl" [src]="message.imageUrl" alt="Chat Image" class="chat-image">
        </div>
      </div>
    </div>

    <form class="message-input" *ngIf="selectedChannel" (ngSubmit)="sendMessage()">
      <!-- Hidden file input triggered by the button -->
      <input type="file" #imageInput style="display: none;" (change)="onImageSelected($event)" accept="image/*">
      
      <!-- Button to trigger file input -->
      <button type="button" class="btn btn-secondary" (click)="imageInput.click()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-paperclip" viewBox="0 0 16 16"><path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0z"/></svg>
      </button>

      <input 
        type="text" 
        class="form-control"
        [(ngModel)]="newMessageText" 
        name="newMessageText" 
        placeholder="Type your message in #{{ selectedChannel.name }}..."
        autocomplete="off"
      >
      <button type="submit" class="btn btn-primary">Send</button>
    </form>

  </div>

</div>
</div>
