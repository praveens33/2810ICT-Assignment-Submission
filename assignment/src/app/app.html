<header>
  <h1>My Chat App</h1>
  <nav>
    <ng-container *ngIf="authService.currentUser$ | async as currentUser; else loggedOut">
      <!-- Logged IN state -->
      <ul>
        <li><a routerLink="/chat">Chat</a></li>
        <li *ngIf="currentUser.roles.includes('Super Admin') || currentUser.roles.includes('Group Admin')">
          <a routerLink="/admin">Admin Dashboard</a>
        </li>
        <li>
          <button (click)="logout()" class="btn btn-link">Logout</button>
        </li>
      </ul>
    </ng-container>
    <!-- Logged OUT state -->
    <ng-template #loggedOut>
      <ul>
        <li><a routerLink="/login">Login</a></li>
        <li><a routerLink="/register">Register</a></li>
      </ul>
    </ng-template>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
