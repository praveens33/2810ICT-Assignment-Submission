<div *ngIf="authService.currentUser$ | async as currentUser" class="container-fluid mt-4 dashboard-container">
  <div class="dashboard-header">
    <h2>Admin Dashboard </h2>
    <div class="header-actions">
      <button (click)="goToChat()" class="btn btn-secondary">← Go Back to Chat</button>
      <button (click)="goToGroupSettings()" class="btn btn-primary ms-2">Go to Group Settings</button>
    </div>
  </div>



  <div class="tab-content" id="adminTabContent">
    <!-- User Management Panel -->
    <div class="tab-pane fade show active" id="users-panel" role="tabpanel" aria-labelledby="users-tab" *ngIf="currentUser && authService.isSuperAdmin(currentUser)">
      <div class="card">
        <div class="card-header">Global User Management ({{ filteredUsers.length }} users)</div>
        <div class="card-body">
          <h5 class="mt-3">Create New User</h5>
          <form #createUserForm="ngForm" (ngSubmit)="superAdminCreateUser()" class="d-flex align-items-center mb-4">
            <input type="text" class="form-control" [(ngModel)]="newUsername" name="newUsername" placeholder="Enter username..." required>
            <input type="email" class="form-control ms-2" [(ngModel)]="newUserEmail" name="newUserEmail" placeholder="Enter email..." required>
            <button type="submit" class="btn btn-primary ms-2" [disabled]="!createUserForm.form.valid">Create</button>
          </form>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <input type="text" class="form-control w-50 search-input" placeholder="Search users..." [(ngModel)]="userSearchTerm" (input)="onUserSearchChange()">
          </div>

          <p *ngIf="paginatedUsers.length === 0 && allUsers.length > 0" class="text-muted mt-3">No users found for "{{userSearchTerm}}".</p>

          <table class="table table-hover">
            <thead>
              <tr>
                <th>Username</th>
                <th>Roles</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of paginatedUsers; trackBy: trackByUser" @listAnimation>
                <td>{{ user.username }}</td>
                <td>{{ user.roles.join(', ') }}</td>
                <td>
                  <button *ngIf="!user.roles.includes('Group Admin')" (click)="promoteToGroupAdmin(user._id)" class="btn btn-sm btn-success">Promote to Group Admin</button>
                  <button *ngIf="!user.roles.includes('Super Admin')" (click)="promoteToSuperAdmin(user._id)" class="btn btn-sm btn-warning ms-2">Promote to Super Admin</button>
                  <button *ngIf="user.roles.includes('Group Admin') && user.username !== 'super'" (click)="demoteFromGroupAdmin(user._id)" class="btn btn-sm btn-secondary ms-2">Demote from Group Admin</button>
                  <button *ngIf="user.roles.includes('Super Admin') && user.username !== 'super'" (click)="demoteFromSuperAdmin(user._id)" class="btn btn-sm btn-dark ms-2">Demote from Super Admin</button>
                  <button *ngIf="user.username !== 'super'" (click)="removeUser(user._id)" class="btn btn-sm btn-danger ms-2">Remove User</button>
                </td>
              </tr>
            </tbody>
          </table>

          <nav *ngIf="userTotalPages > 1" aria-label="User pagination">
            <ul class="pagination justify-content-center">
              <li class="page-item" [class.disabled]="userCurrentPage === 1">
                <a class="page-link" href="#" (click)="goToUserPage(userCurrentPage - 1); $event.preventDefault()">Previous</a>
              </li>
              <li class="page-item" *ngFor="let page of userPages" [class.active]="page === userCurrentPage">
                <a class="page-link" href="#" (click)="goToUserPage(page); $event.preventDefault()">{{ page }}</a>
              </li>
              <li class="page-item" [class.disabled]="userCurrentPage === userTotalPages">
                <a class="page-link" href="#" (click)="goToUserPage(userCurrentPage + 1); $event.preventDefault()">Next</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>

  </div>
</div>
